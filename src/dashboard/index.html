<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PumpFun Bot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --border: #e3e6eb;
    --pos: #0f9d58; --neg: #d93025; --accent: #3b5bdb; --paper: #3b5bdb; --live: #d93025;
    --chart: #3b5bdb; --chart-fill: rgba(59, 91, 219, 0.10); --row: #fafbfc; --hover: #f1f3f7;
    --on-accent: #ffffff; --warn: #c77c00;
  }
  /* Dark colors: follow the system unless the theme button picked one. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #8b93a3; --border: #262b35;
      --pos: #34c77b; --neg: #ff6b5e; --accent: #7c96ff; --paper: #7c96ff; --live: #ff6b5e;
      --chart: #7c96ff; --chart-fill: rgba(124, 150, 255, 0.12); --row: #1b1f27; --hover: #20242d;
      --on-accent: #0f1115; --warn: #f0a63a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #8b93a3; --border: #262b35;
    --pos: #34c77b; --neg: #ff6b5e; --accent: #7c96ff; --paper: #7c96ff; --live: #ff6b5e;
    --chart: #7c96ff; --chart-fill: rgba(124, 150, 255, 0.12); --row: #1b1f27; --hover: #20242d;
    --on-accent: #0f1115; --warn: #f0a63a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
  .badge.paper { background: var(--paper); } .badge.live { background: var(--live); }
  .chip { font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); display: inline-flex; align-items: center; gap: 7px; }
  .pill { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--pos); } .dot.bad { background: var(--neg); } .dot.warn { background: var(--warn); }
  .spacer { flex: 1; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger { color: var(--neg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); padding: 9px 18px; }
  button.primary:hover { filter: brightness(1.08); }
  .notice { display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--neg); color: var(--neg); background: var(--panel); }
  .notice.info { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .section { margin-bottom: 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  svg { display: block; width: 100%; height: 220px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  tbody tr:nth-child(even) { background: var(--row); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .empty { color: var(--muted); padding: 10px 2px; }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; max-height: 260px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .log .warn { color: var(--warn); } .log .error { color: var(--neg); } .log .trade { color: var(--pos); }
  .muted { color: var(--muted); }
  footer { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Bot picker */
  .picker { padding: 18px 20px; }
  .picker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .select { position: relative; }
  .select-btn { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; padding: 9px 14px; min-width: 220px; justify-content: space-between; }
  .chev { color: var(--muted); font-size: 12px; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; width: min(380px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: 8px;
    padding: 10px 12px; background: transparent; font-weight: 400; }
  .opt:hover, .opt:focus-visible { background: var(--hover); outline: none; }
  .opt-main { flex: 1; min-width: 0; }
  .opt-name { font-weight: 700; font-size: 15px; }
  .opt-desc { color: var(--muted); font-size: 13px; }
  .check { color: var(--accent); font-weight: 700; visibility: hidden; }
  .opt[aria-selected="true"] .check { visibility: visible; }
  .bot-desc { margin: 14px 0 10px; max-width: 760px; }
  .rules { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 12px; }
  .rules dt { color: var(--muted); font-size: 13px; }
  .rules dd { margin: 0; font-size: 13px; }
  .acct { font-size: 13px; color: var(--muted); margin: 0; }
  .err { color: var(--neg); font-size: 13px; }
  button.small { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .limit-hit { color: var(--warn); font-weight: 600; }
  .hot-tag { font-size: 11px; font-weight: 700; color: var(--neg); border: 1px solid var(--neg); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
</style>
<script>
  // Apply the saved theme before the page paints, so it never flashes the wrong colors.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main>
  <header>
    <h1>PumpFun Bot</h1>
    <span id="mode" class="badge paper">PAPER</span>
    <span id="botChip" class="chip"><span id="botDot" class="dot"></span><span id="botText">No bot running</span></span>
    <span class="pill"><span id="feedDot" class="dot"></span><span id="feedText">Feed</span></span>
    <span class="pill"><span id="rpcDot" class="dot"></span><span id="rpcText">RPC</span></span>
    <span class="pill" id="riskText"></span>
    <span class="pill"><span id="hourText"></span><button id="resetHourBtn" class="small" title="Forget this hour's trades so the bot can buy again now">Reset</button></span>
    <span class="spacer"></span>
    <button id="themeBtn" title="Switch between light and dark">Light theme</button>
    <button id="pauseBtn" hidden>Pause</button>
    <button id="closeBtn" class="danger">Close all</button>
    <button id="stopBtn" class="danger" hidden>Stop bot</button>
  </header>

  <div id="notice" class="notice"></div>

  <section id="picker" class="card section picker" hidden>
    <h2>Choose a bot</h2>
    <div class="picker-row">
      <div class="select">
        <button id="selBtn" class="select-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="selName">Primal 1-1</span><span class="chev">▾</span>
        </button>
        <div id="selMenu" class="menu" role="listbox" hidden></div>
      </div>
      <button id="startBtn" class="primary">Start</button>
      <span id="startErr" class="err"></span>
    </div>
    <p id="selDesc" class="bot-desc"></p>
    <dl id="selRules" class="rules"></dl>
    <p class="acct">Both bots trade from the same account: <span id="acct"></span></p>
  </section>

  <div class="grid">
    <div class="card kpi"><div class="label">Equity</div><div class="value" id="equity">–</div><div class="sub" id="equityUsd"></div></div>
    <div class="card kpi"><div class="label">Total P&amp;L</div><div class="value" id="pnl">–</div><div class="sub" id="pnlSub"></div></div>
    <div class="card kpi"><div class="label">Cash</div><div class="value" id="cash">–</div><div class="sub" id="cashSub"></div></div>
    <div class="card kpi"><div class="label">Win rate</div><div class="value" id="winrate">–</div><div class="sub" id="wl"></div></div>
    <div class="card kpi"><div class="label">Fees paid</div><div class="value" id="fees">–</div><div class="sub" id="feesSub"></div></div>
    <div class="card kpi"><div class="label">Watching</div><div class="value" id="watching">–</div><div class="sub" id="seen"></div></div>
  </div>

  <div class="card section">
    <h2>Equity (SOL)</h2>
    <svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="none" role="img" aria-label="Equity over time"></svg>
  </div>

  <div class="card section">
    <h2>Open positions</h2>
    <div class="table-wrap" id="positions"></div>
  </div>

  <div class="card section" id="hotCard" hidden>
    <h2>Hot list · 1h trending</h2>
    <div class="table-wrap" id="hot"></div>
  </div>

  <div class="two">
    <div class="card section">
      <h2>Recent trades</h2>
      <div class="table-wrap" id="trades"></div>
    </div>
    <div class="card section">
      <h2>Activity</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <footer id="settings"></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sol = (x, d = 4) => (x == null || !isFinite(x) ? "–" : x.toFixed(d));
const signed = (x, d = 4) => (x >= 0 ? "+" : "") + x.toFixed(d);
const pctTxt = (x) => (x >= 0 ? "+" : "") + x.toFixed(1) + "%";
const cls = (x) => (x > 0 ? "pos" : x < 0 ? "neg" : "");
const dur = (s) => (s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s");
const time = (t) => new Date(t).toLocaleTimeString();
let state = null;
let selected = "primal";
try { selected = localStorage.getItem("selectedBot") || "primal"; } catch {}
let menuBuilt = false;

const bots = () => (state ? state.app.bots : []);
const botById = (id) => bots().find((b) => b.id === id);
const botShort = (id) => (botById(id)?.name || id || "").replace(/ \d+-\d+$/, "");

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "X-Bot-Action": "1", "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json().catch(() => ({ ok: res.ok }));
}
async function act(path) { await post(path); refresh(); }

// Theme: the button shows the theme you'd switch to. The choice is remembered.
const darkNow = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
};
const paintThemeBtn = () => { $("themeBtn").textContent = darkNow() ? "Light theme" : "Dark theme"; };
$("themeBtn").onclick = () => {
  const next = darkNow() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  paintThemeBtn();
};
paintThemeBtn();

$("resetHourBtn").onclick = () => act("/api/reset-hourly");

// Sell buttons are re-drawn every refresh, so listen on the table container.
$("positions").addEventListener("click", async (e) => {
  const btn = e.target.closest(".sell-btn");
  if (!btn || btn.disabled) return;
  const live = state?.mode === "live";
  if (!confirm(`Sell ${btn.dataset.symbol} now${live ? " with REAL money" : ""}?`)) return;
  btn.disabled = true;
  btn.textContent = "Selling…";
  const r = await post("/api/sell", { mint: btn.dataset.mint });
  if (!r.ok) alert(r.error || "Could not sell");
  refresh();
});
$("pauseBtn").onclick = () => act(state?.risk.paused ? "/api/resume" : "/api/pause");
$("closeBtn").onclick = () => {
  if (confirm("Sell every open position now and pause new buys?")) act("/api/close-all");
};
$("stopBtn").onclick = () => {
  const name = botById(state?.app.activeBot)?.name || "the bot";
  const open = state?.positions.length || 0;
  if (confirm(`Stop ${name}?${open ? ` Its ${open} open trade(s) will be sold first.` : ""}`)) act("/api/stop");
};
$("startBtn").onclick = async () => {
  const bot = botById(selected);
  if (!bot) return;
  if (state.mode === "live" && !confirm(`Start ${bot.name} with REAL money?`)) return;
  $("startErr").textContent = "";
  const r = await post("/api/start", { bot: bot.id });
  if (!r.ok) $("startErr").textContent = r.error || "Could not start";
  refresh();
};

// Claude-style picker: a button that opens a list of bots.
const menu = $("selMenu");
function setMenu(open) {
  menu.hidden = !open;
  $("selBtn").setAttribute("aria-expanded", String(open));
  if (open) menu.querySelector('[aria-selected="true"]')?.focus();
}
$("selBtn").onclick = (e) => { e.stopPropagation(); setMenu(menu.hidden); };
document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

function buildMenu() {
  menu.innerHTML = bots().map((b) => `
    <button class="opt" role="option" data-id="${esc(b.id)}" aria-selected="false">
      <span class="opt-main"><span class="opt-name">${esc(b.name)}</span><br><span class="opt-desc">${esc(b.tagline)}</span></span>
      <span class="check">✓</span>
    </button>`).join("");
  menu.querySelectorAll(".opt").forEach((el) => {
    el.onclick = () => {
      selected = el.dataset.id;
      try { localStorage.setItem("selectedBot", selected); } catch {}
      setMenu(false);
      renderPicker();
    };
  });
  menuBuilt = true;
}

function renderPicker() {
  if (!botById(selected)) selected = bots()[0]?.id;
  const bot = botById(selected);
  if (!bot) return;
  $("selName").textContent = bot.name;
  $("startBtn").textContent = `Start ${bot.name}`;
  $("selDesc").textContent = bot.description;
  $("selRules").innerHTML = bot.rules.map((r) => `<dt>${esc(r.label)}</dt><dd>${esc(r.value)}</dd>`).join("");
  menu.querySelectorAll(".opt").forEach((el) => el.setAttribute("aria-selected", String(el.dataset.id === selected)));
}

function drawChart(points, startSol) {
  const svg = $("chart");
  if (points.length < 2) { svg.innerHTML = '<text x="400" y="110" text-anchor="middle" fill="currentColor" opacity="0.5" font-size="14">Collecting data…</text>'; return; }
  const W = 800, H = 220, pad = 8;
  const ys = points.map((p) => p.equitySol).concat([startSol]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-6) { hi += 0.001; lo -= 0.001; }
  const t0 = points[0].t, t1 = points[points.length - 1].t || t0 + 1;
  const x = (t) => pad + ((t - t0) / Math.max(1, t1 - t0)) * (W - 2 * pad);
  const y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - 2 * pad);
  const line = points.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.equitySol).toFixed(1)).join(" ");
  const area = line + ` L${x(t1).toFixed(1)},${H - pad} L${x(t0).toFixed(1)},${H - pad} Z`;
  svg.innerHTML =
    `<path d="${area}" fill="var(--chart-fill)"/>` +
    `<line x1="${pad}" x2="${W - pad}" y1="${y(startSol)}" y2="${y(startSol)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>` +
    `<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<text x="${W - pad}" y="14" text-anchor="end" font-size="12" fill="var(--muted)">${hi.toFixed(4)}</text>` +
    `<text x="${W - pad}" y="${H - 12}" text-anchor="end" font-size="12" fill="var(--muted)">${lo.toFixed(4)}</text>`;
}

function render(s) {
  state = s;
  if (!menuBuilt && s.app.bots.length) { buildMenu(); renderPicker(); }
  const usd = (v) => (s.solUsd ? "$" + (v * s.solUsd).toFixed(2) : "");
  const live = s.mode === "live";
  $("mode").textContent = live ? "LIVE · REAL MONEY" : "PAPER · FAKE MONEY";
  $("mode").className = "badge " + (live ? "live" : "paper");

  // Which bot is running
  const app = s.app;
  const activeName = botById(app.activeBot)?.name;
  const running = app.phase === "running";
  $("botDot").className = "dot " + (running ? "ok" : app.phase === "idle" ? "" : "warn");
  $("botText").textContent =
    app.phase === "running" ? `${activeName} · running` :
    app.phase === "starting" ? `${activeName} · starting…` :
    app.phase === "stopping" ? `${activeName} · stopping…` : "No bot running";
  $("picker").hidden = app.phase !== "idle";
  $("stopBtn").hidden = !(running || app.phase === "starting");
  $("pauseBtn").hidden = !running;

  $("feedDot").className = "dot " + (s.feed.connected ? "ok" : "bad");
  $("feedText").textContent = s.feed.connected ? `Feed live (${s.feed.lastMessageAgoSec ?? "–"}s ago)` : "Feed disconnected";
  const rpcOk = s.tracker.lastPollAgoSec != null && s.tracker.lastPollAgoSec < 10;
  $("rpcDot").className = "dot " + (rpcOk ? "ok" : "bad");
  $("rpcText").textContent = `RPC ${s.tracker.lastPollMs}ms · ${s.tracker.rpcErrors} errors`;

  const r = s.risk;
  const riskBits = [];
  if (r.paused && running) riskBits.push("Paused");
  if (r.haltedForDay) riskBits.push("Daily loss limit hit");
  if (r.cooldownSec > 0) riskBits.push(`Cooldown ${dur(r.cooldownSec)}`);
  $("riskText").textContent = riskBits.join(" · ");
  const limitHit = r.tradesLastHour >= r.maxTradesPerHour;
  $("hourText").textContent = limitHit
    ? `Hourly limit reached (${r.tradesLastHour}/${r.maxTradesPerHour})`
    : `${r.tradesLastHour}/${r.maxTradesPerHour} trades this hour`;
  $("hourText").className = limitHit ? "limit-hit" : "";
  $("resetHourBtn").disabled = r.tradesLastHour === 0;
  $("pauseBtn").textContent = r.paused ? "Resume" : "Pause";

  const notice = $("notice");
  if (r.haltedForDay) {
    notice.className = "notice"; notice.style.display = "block";
    notice.textContent = "Daily loss limit reached. No new trades until tomorrow.";
  } else if (app.phase === "stopping") {
    notice.className = "notice info"; notice.style.display = "block";
    notice.textContent = `Stopping ${activeName}: selling open trades, then you can pick a bot again…`;
  } else if (app.phase === "starting" && live) {
    notice.className = "notice"; notice.style.display = "block";
    notice.textContent = `Starting ${activeName} with real money in a few seconds. Press Stop bot to cancel.`;
  } else notice.style.display = "none";

  $("acct").textContent = `${sol(s.equitySol)} SOL ${s.solUsd ? "(" + usd(s.equitySol) + ")" : ""}, ${pctTxt(s.pnlPct)} since start, ${s.wins + s.losses} trades`;

  $("equity").textContent = sol(s.equitySol) + " SOL";
  $("equityUsd").textContent = usd(s.equitySol) + (s.solUsd ? ` · SOL $${s.solUsd.toFixed(2)}` : "");
  $("pnl").textContent = signed(s.pnlSol) + " SOL";
  $("pnl").className = "value " + cls(s.pnlSol);
  $("pnlSub").textContent = pctTxt(s.pnlPct) + (s.solUsd ? " · " + (s.pnlSol >= 0 ? "+" : "-") + "$" + Math.abs(s.pnlSol * s.solUsd).toFixed(2) : "") + ` · start ${sol(s.startSol)}`;
  $("cash").textContent = sol(s.cashSol) + " SOL";
  $("cashSub").textContent = `${s.positions.length} open · ${sol(s.settings.tradeSizeSol, 3)} SOL/trade`;
  const n = s.wins + s.losses;
  $("winrate").textContent = n ? Math.round((s.wins / n) * 100) + "%" : "–";
  $("wl").textContent = `${s.wins} wins / ${s.losses} losses`;
  $("fees").textContent = sol(s.feesPaidSol) + " SOL";
  $("feesSub").textContent = `${usd(s.feesPaidSol)} · ${s.failedTxCount} failed tx`;
  $("watching").textContent = s.tracker.watching;
  $("seen").textContent = `${s.feed.tokensSeen} launches seen · ${s.tracker.shadow} recording`;

  drawChart(s.equityHistory, s.startSol);

  $("positions").innerHTML = s.positions.length
    ? `<table><thead><tr><th>Coin</th><th>Bot</th><th class="num">Age</th><th class="num">Price</th><th class="num">Cost</th><th class="num">Value now</th><th>Status</th><th></th></tr></thead><tbody>` +
      s.positions.map((p) => `<tr>
        <td><a href="https://pump.fun/coin/${encodeURIComponent(p.mint)}" target="_blank" rel="noopener noreferrer">${esc(p.symbol || p.mint.slice(0, 6))}</a> <span class="muted">${esc(p.name)}</span></td>
        <td>${esc(botShort(p.bot))}</td>
        <td class="num">${dur(p.ageSec)}</td>
        <td class="num ${cls(p.pricePct)}">${pctTxt(p.pricePct)}</td>
        <td class="num">${sol(p.costSol)}</td>
        <td class="num ${cls(p.valueSol - p.costSol)}">${sol(p.valueSol)}</td>
        <td>${p.selling ? "Selling…" : "Holding"}</td>
        <td class="num"><button class="small danger sell-btn" data-mint="${esc(p.mint)}" data-symbol="${esc(p.symbol)}" ${p.selling ? "disabled" : ""}>Sell</button></td></tr>`).join("") + `</tbody></table>`
    : `<div class="empty">${running ? "No open positions. " + esc(activeName) + " is watching for its next buy." : "No open positions."}</div>`;

  const usdShort = (x) => (x >= 1e6 ? "$" + (x / 1e6).toFixed(2) + "M" : "$" + Math.round(x / 1e3) + "K");
  $("hotCard").hidden = !s.hot;
  if (s.hot) {
    $("hot").innerHTML = s.hot.length
      ? `<table><thead><tr><th>Coin</th><th class="num">Market cap</th><th class="num">1h</th><th class="num">5m</th><th class="num">Liquidity</th><th>Status</th></tr></thead><tbody>` +
        s.hot.map((h) => `<tr>
          <td><a href="https://pump.fun/coin/${encodeURIComponent(h.mint)}" target="_blank" rel="noopener noreferrer">${esc(h.symbol)}</a>${h.hot ? ' <span class="hot-tag">HOT</span>' : ""}</td>
          <td class="num">${usdShort(h.fdvUsd)}</td>
          <td class="num ${cls(h.change1h)}">${pctTxt(h.change1h)}</td>
          <td class="num ${cls(h.change5m)}">${pctTxt(h.change5m)}</td>
          <td class="num">${usdShort(h.liquidityUsd)}</td>
          <td class="${h.hot ? "" : "muted"}">${esc(h.status)}</td></tr>`).join("") + `</tbody></table>`
      : `<div class="empty">Loading the trending list…</div>`;
  }

  $("trades").innerHTML = s.recentTrades.length
    ? `<table><thead><tr><th>Time</th><th>Coin</th><th>Bot</th><th>Exit</th><th class="num">Hold</th><th class="num">P&amp;L</th><th class="num">%</th></tr></thead><tbody>` +
      s.recentTrades.map((t) => `<tr>
        <td>${time(t.closedAt)}</td>
        <td><a href="https://pump.fun/coin/${encodeURIComponent(t.mint)}" target="_blank" rel="noopener noreferrer">${esc(t.symbol || t.mint.slice(0, 6))}</a></td>
        <td>${esc(botShort(t.bot))}</td>
        <td>${esc(t.reason.replace(/_/g, " "))}</td>
        <td class="num">${dur(t.holdSec)}</td>
        <td class="num ${cls(t.pnlSol)}">${signed(t.pnlSol)}</td>
        <td class="num ${cls(t.pnlPct)}">${pctTxt(t.pnlPct)}</td></tr>`).join("") + `</tbody></table>`
    : `<div class="empty">No closed trades yet.</div>`;

  // Newest first.
  $("log").innerHTML = s.logs.slice().reverse().map((l) => `<div class="${l.level}">${time(l.t)} ${esc(l.msg)}</div>`).join("");

  const activeBot = botById(app.activeBot);
  $("settings").textContent = activeBot && app.phase !== "idle"
    ? `${activeBot.name}: ` + activeBot.rules.map((x) => `${x.label.toLowerCase()} ${x.value}`).join(" · ")
    : `Account running since ${new Date(s.startedAt).toLocaleString()}`;
}

async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    render(await res.json());
  } catch {
    $("feedDot").className = "dot bad";
    $("feedText").textContent = "Bot not reachable";
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
